<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Contact Benedict — get in touch with me." />
  <title>Contact | My Portfolio</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- ==================== HEADER ==================== -->
  <header>
    <!-- LOGO IMAGE
         Replace 'your-logo.png' with your actual logo file path.
         Example: src="images/logo.png"
         The alt text shows if the image fails to load.          -->
    <div class="logo">
      <img src="your-logo.png" alt="Benedict Logo" class="logo-img" />
    </div>

    <nav>
      <ul>
        <li><a href="home.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="skill.html">Skills</a></li>
        <li><a href="portfolio.html">Portfolio</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- ==================== CONTACT SECTION ==================== -->
  <section class="contact">

    <!-- Section heading (same pattern as other pages) -->
    <div class="section-heading">
      <span class="section-label">Get In Touch</span>
      <h1>Contact <span>Me</span></h1>
      <div class="section-divider"></div>
    </div>

    <!-- Contact form -->
    <div class="contact-wrapper">
      <form class="contact-form" action="#" method="post">

        <!-- Full Name -->
        <div class="form-group">
          <label for="full-name">Full Name</label>
          <input type="text" id="full-name" name="full-name" placeholder="Enter your full name" required />
        </div>

        <!-- Email Address -->
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="Enter your email address" required />
        </div>

        <!-- Send Button -->
        <button type="submit" class="btn-primary btn-submit">Send Message</button>

      </form>
    </div>
    <!-- end contact-wrapper -->

  </section>

  <!-- ==================== FOOTER ==================== -->
  <footer class="footer">
    <div class="footer-content">
      <p class="footer-name">Benedict</p>
      <p class="footer-copy">&copy; 2025 Benedict. All rights reserved.</p>
      <nav class="footer-nav">
        <a href="home.html">Home</a>
        <a href="about.html">About</a>
        <a href="skill.html">Skills</a>
        <a href="portfolio.html">Portfolio</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </footer>

</body>

</html>
